<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 280px; margin: 0; font-family: Inter, system-ui, sans-serif; color: #0c1a35; padding: 18px; }
    h1 { font-size: 15px; font-weight: 800; margin: 0 0 2px; }
    p { font-size: 12px; color: #64748b; margin: 0 0 14px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid #e2e6f0; border-radius: 10px; font-size: 13px; outline: none; margin-bottom: 10px; }
    input:focus { border-color: #1d3a8f; }
    button { width: 100%; padding: 11px; background: #1d3a8f; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .hint { font-size: 11px; color: #94a3b8; margin-top: 10px; }
    .ok { color: #047857; font-size: 12px; font-weight: 700; margin-top: 8px; display: none; }
    details { margin-top: 12px; } summary { font-size: 11px; color: #64748b; cursor: pointer; }
  </style>
</head>
<body>
  <h1>JobEngine Auto-Apply</h1>
  <p>Enter the same email you used at /jobengine. On any Greenhouse or Lever apply page, click the ⚡ Auto-fill button.</p>
  <label for="email">Your JobEngine email</label>
  <input id="email" type="email" placeholder="you@example.com" />
  <button id="save">Save</button>
  <div class="ok" id="ok">Saved ✓</div>
  <details>
    <summary>Advanced: API URL</summary>
    <input id="apiBase" type="text" placeholder="http://localhost:3000" style="margin-top:8px" />
  </details>
  <div class="hint">The resume file itself must be dragged in by you — browsers block scripts from attaching files.</div>
  <script src="popup.js"></script>
</body>
</html>
